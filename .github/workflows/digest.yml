name: YouTube Digest

on:
  schedule:
    # 6:00 AM IST (00:30 UTC)
    - cron: "30 0 * * *"
    # 6:00 PM IST (12:30 UTC)
    - cron: "30 12 * * *"
  workflow_dispatch: {}

jobs:
  run-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest script
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHANNEL_IDS: ${{ secrets.CHANNEL_IDS }}
          LOOKBACK_HOURS: ${{ vars.LOOKBACK_HOURS || '24' }}
          MAX_VIDEOS_PER_CHANNEL: ${{ vars.MAX_VIDEOS_PER_CHANNEL || '5' }}
          MAX_TOTAL_VIDEOS: ${{ vars.MAX_TOTAL_VIDEOS || '20' }}
          VIDEO_SUMMARY_MODEL: ${{ vars.VIDEO_SUMMARY_MODEL || 'gemini-2.5-flash' }}
          DIGEST_MODEL: ${{ vars.DIGEST_MODEL || 'gemini-2.5-pro' }}
        run: python main.py