name: YouTube Digest

on:
  schedule:
    # 6:00 AM IST (00:30 UTC)
    - cron: "30 0 * * *"
    # 6:00 PM IST (12:30 UTC)
    - cron: "30 12 * * *"
  workflow_dispatch: {}

jobs:
  run-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest script
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHANNEL_IDS: ${{ secrets.CHANNEL_IDS }}
          LOOKBACK_HOURS: ${{ vars.LOOKBACK_HOURS || '24' }}
          MAX_VIDEOS_PER_CHANNEL: ${{ vars.MAX_VIDEOS_PER_CHANNEL || '2' }}
          MAX_TOTAL_VIDEOS: ${{ vars.MAX_TOTAL_VIDEOS || '4' }}
          YOUTUBE_CHANNEL_DELAY_MS: ${{ vars.YOUTUBE_CHANNEL_DELAY_MS || '1500' }}
          YOUTUBE_MAX_RETRIES: ${{ vars.YOUTUBE_MAX_RETRIES || '5' }}
          GEMINI_RPM: ${{ vars.GEMINI_RPM || '4' }}
          GEMINI_CALL_DELAY_MS: ${{ vars.GEMINI_CALL_DELAY_MS || '0' }}
          GEMINI_FINAL_DELAY_MS: ${{ vars.GEMINI_FINAL_DELAY_MS || '0' }}
          LLM_MAX_RETRIES: ${{ vars.LLM_MAX_RETRIES || '2' }}
          LLM_BACKOFF_BASE_SECONDS: ${{ vars.LLM_BACKOFF_BASE_SECONDS || '3' }}
          VIDEO_SUMMARY_MODEL: ${{ vars.VIDEO_SUMMARY_MODEL || 'gemini-2.5-flash-lite' }}
          VIDEO_SUMMARY_FALLBACK_MODEL: ${{ vars.VIDEO_SUMMARY_FALLBACK_MODEL || 'gemini-2.5-flash-lite' }}
          DIGEST_MODEL: ${{ vars.DIGEST_MODEL || 'gemini-2.5-flash-lite' }}
          DIGEST_FALLBACK_MODEL: ${{ vars.DIGEST_FALLBACK_MODEL || 'gemini-2.5-flash-lite' }}
        run: python main.py